name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin leakguard

      - name: Compute checksums
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum leakguard${{ matrix.suffix }} > leakguard-${{ matrix.target }}.sha256
          # Also produce a .tar.gz / .zip archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip leakguard-${{ matrix.target }}.zip leakguard${{ matrix.suffix }}
          else
            tar czf leakguard-${{ matrix.target }}.tar.gz leakguard${{ matrix.suffix }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/leakguard${{ matrix.suffix }}
            target/${{ matrix.target }}/release/leakguard-${{ matrix.target }}.sha256
            target/${{ matrix.target }}/release/leakguard-${{ matrix.target }}.*

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}